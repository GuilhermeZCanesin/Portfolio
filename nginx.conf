server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não vaza versão do nginx
    server_tokens off;

    # Cabeçalhos de segurança (defesa em profundidade; o Caddy público também
    # aplica os dele via `import security_headers`).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # Endpoint de saúde para o healthcheck do compose
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets com cache longo
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA-friendly: cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
